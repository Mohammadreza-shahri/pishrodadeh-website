name: Validate and deploy staging

on:
  push:
    branches:
      - mohammadreza-shahri-deploy-pishrodadeh-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/engine.js
          node --check dist/i18n.js
          node --check dist/quote.js

      - name: Run regression tests
        run: |
          node tools/test-engine.mjs
          node tools/test-quote.mjs

  deploy:
    name: Deploy dist to staging server
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.aria-man.com/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing staging environment secret: STAGING_SSH_KEY"
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing staging environment secret: STAGING_KNOWN_HOSTS"
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_deploy"
          chmod 600 "$HOME/.ssh/staging_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload static files
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_HOST" ]; then
            echo "::error::Missing staging environment secret: STAGING_HOST"
            exit 1
          fi
          if [ -z "$STAGING_USER" ]; then
            echo "::error::Missing staging environment secret: STAGING_USER"
            exit 1
          fi
          if [ -z "$STAGING_PATH" ]; then
            echo "::error::Missing staging environment secret: STAGING_PATH"
            exit 1
          fi
          port="${STAGING_PORT:-22}"
          tar -C dist -czf - . | ssh \
            -i "$HOME/.ssh/staging_deploy" \
            -p "$port" \
            -o BatchMode=yes \
            "$STAGING_USER@$STAGING_HOST" \
            "set -eu; mkdir -p '$STAGING_PATH'; tmp=\$(mktemp -d); trap 'rm -rf \"\$tmp\"' EXIT; tar -xzf - -C \"\$tmp\"; find '$STAGING_PATH' -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a \"\$tmp\"/. '$STAGING_PATH'/"

      - name: Verify staging response
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --location https://staging.aria-man.com/ > /dev/null
