name: Refresh language-model suggestions

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-language-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check publisher feeds every three days
        run: node tools/refresh-language-models.mjs
      - name: Validate refreshed catalog and bilingual UI
        run: |
          node tools/test-language-models.mjs
          node tools/test-products.mjs
          node tools/test-gpu.mjs
      - name: Publish validated static snapshot
        id: publish
        run: |
          if git diff --quiet -- dist/language-models.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/language-models.json
          git commit -m "Refresh publisher language-model suggestions" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Validate and deploy updated snapshot to staging only
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-staging.yml --ref main
